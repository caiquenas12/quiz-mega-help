<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participar do Quiz</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background-color: #0d0d11; 
      background: #0d0d11 url('img/fundo24.png') no-repeat center center fixed;
      background-size: cover;
      color: white; 
      margin: 0; 
      padding: 20px; 
      text-align: center; 
      min-height: 100vh;
      box-sizing: border-box;
    }
    
    .card { 
      background: rgba(47, 28, 28, 0.9);
      backdrop-filter: blur(8px);
      padding: 20px; 
      border-radius: 15px; 
      max-width: 400px; 
      margin: 0 auto; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    input[type="text"] { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    
    .avatar-upload { margin: 15px 0; display: flex; flex-direction: column; align-items: center; }
    .avatar-preview { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ff9b71; object-fit: cover; margin-bottom: 10px; background: #444; }
    .file-input-label { background: #ff9b71; color: #111; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; cursor: pointer; display: inline-block; }
    input[type="file"] { display: none; }

    .btn-main { background: #4a4a92; color: white; padding: 12px 25px; border: none; border-radius: 50px; font-size: 18px; cursor: pointer; width: 95%; margin-top: 15px; font-weight: bold; }
    
    .header-quiz { display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0.3); padding: 8px 15px; border-radius: 10px; margin-bottom: 15px; }
    .tema-tag { font-size: 14px; color: #ff9800; font-weight: bold; text-transform: uppercase; }
    .cronometro-tag { font-size: 18px; font-weight: bold; color: #00ff66; }

    .question-box { background: rgba(0, 0, 0, 0.4); padding: 15px; border-radius: 10px; margin-bottom: 15px; font-size: 18px; font-weight: bold; line-height: 1.4; text-align: left; }

    .option-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border-radius: 30px; border: none; font-size: 16px; font-weight: bold; color: #111; cursor: pointer; text-align: center; transition: transform 0.1s, filter 0.2s; }
    .opt-0 { background-color: #8cd3b3; }
    .opt-1 { background-color: #cde4c4; }
    .opt-2 { background-color: #ff9b71; }
    .opt-3 { background-color: #ff8585; }
    .option-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ESTILOS DE DESTAQUE PARA AS RESPOSTAS */
    .option-btn.selected { border: 4px solid #ffffff; transform: scale(1.02); }
    .option-btn.correct-answer { background-color: #00e676 !important; color: #000 !important; font-weight: bold; border: 3px solid #ffffff; }
    .option-btn.wrong-answer { background-color: #ff1744 !important; color: #fff !important; text-decoration: line-through; }

    .placar-aluno { font-size: 14px; color: #aaa; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Tela 1: Login com Foto -->
    <div id="login-screen">
      <h2>Entrar no Quiz</h2>

      <div class="avatar-upload">
        <img id="preview-foto" class="avatar-preview" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Prévia da foto">
        <label for="foto-input" class="file-input-label">📷 Escolher Foto</label>
        <input type="file" id="foto-input" accept="image/*">
      </div>

      <input type="text" id="nome" placeholder="Seu Nome e sobrenome" maxlength="21">
      <input type="text" id="escola" placeholder="Nome da sua Escola" maxlength="35">
      <button class="btn-main" id="btn-entrar" type="button">Entrar no Jogo</button>
    </div>

    <!-- Tela 2: Jogo -->
    <div id="game-screen" style="display: none;">
      
      <div class="header-quiz">
        <span id="aluno-tema" class="tema-tag">Tema</span>
        <span id="aluno-cronometro" class="cronometro-tag">⏱️ --s</span>
      </div>

      <h3 id="status" style="margin: 10px 0 15px 0;">Aguardando a pergunta...</h3>

      <div id="question-container" class="question-box" style="display: none;">
        <span id="aluno-question"></span>
      </div>

      <div id="options-aluno"></div>

      <div id="feedback" style="font-size: 20px; font-weight: bold; margin-top: 15px;"></div>
      <div id="placar-total" class="placar-aluno"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let fotoBase64 = "";
    const FOTO_PADRAO = "https://cdn-icons-png.flaticon.com/512/847/847969.png";

    // 1. COMPRESSÃO E PRÉ-VISUALIZAÇÃO DA FOTO DE PERFIL
    const fotoInput = document.getElementById("foto-input");
    if (fotoInput) {
      fotoInput.addEventListener("change", function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = 150;
            canvas.height = 150;
            ctx.drawImage(img, 0, 0, 150, 150);
            fotoBase64 = canvas.toDataURL("image/jpeg", 0.7);
            document.getElementById("preview-foto").src = fotoBase64;
          };
        };
        reader.readAsDataURL(file);
      });
    }

    // 2. FUNÇÃO DE ENTRADA NO QUIZ
    function realizarEntrada(nome, escola, foto) {
      const nomeLimitado = nome.trim().slice(0, 23);

      socket.emit("entrar_quiz", { 
        nome: nomeLimitado, 
        escola: escola, 
        foto: foto 
      });

      localStorage.setItem("quiz_aluno_nome", nomeLimitado);
      localStorage.setItem("quiz_aluno_escola", escola);
      if (foto) localStorage.setItem("quiz_aluno_foto", foto);

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "block";
    }

    const btnEntrar = document.getElementById("btn-entrar");
    if (btnEntrar) {
      btnEntrar.onclick = function() {
        const nomeInput = document.getElementById("nome").value;
        const escolaInput = document.getElementById("escola").value;

        if (!nomeInput.trim()) {
          alert("Por favor, digite seu nome antes de entrar!");
          return;
        }

        realizarEntrada(nomeInput, escolaInput, fotoBase64);
      };
    }

    // Auto-login na reconexão
    socket.on("connect", () => {
      const nomeSalvo = localStorage.getItem("quiz_aluno_nome");
      const escolaSalva = localStorage.getItem("quiz_aluno_escola") || "";
      const fotoSalva = localStorage.getItem("quiz_aluno_foto") || "";

      if (nomeSalvo) {
        fotoBase64 = fotoSalva;
        realizarEntrada(nomeSalvo, escolaSalva, fotoSalva);
      }
    });

    // 3. RECEBER NOVA PERGUNTA
    socket.on("nova_pergunta", (q) => {
      const statusEl = document.getElementById("status");
      const feedbackEl = document.getElementById("feedback");
      const container = document.getElementById("options-aluno");
      const questionContainer = document.getElementById("question-container");
      const questionText = document.getElementById("aluno-question");
      const temaText = document.getElementById("aluno-tema");
      const cronometroText = document.getElementById("aluno-cronometro");

      if (statusEl) statusEl.textContent = "Escolha sua resposta rapidamente:";
      if (feedbackEl) feedbackEl.textContent = "";
      if (container) container.innerHTML = "";

      if (q) {
        if (temaText) temaText.textContent = q.tema || "Conhecimentos Gerais";
        if (cronometroText) cronometroText.textContent = `⏱️ ${q.tempo || '--'}s`;

        if (q.question) {
          if (questionText) questionText.textContent = `${q.numero ? q.numero + '. ' : ''}${q.question}`;
          if (questionContainer) questionContainer.style.display = "block";
        } else if (questionContainer) {
          questionContainer.style.display = "none";
        }

        if (q.options && container) {
          q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = `option-btn opt-${index % 4}`;
            btn.dataset.index = index;
            btn.textContent = opt;

            btn.onclick = () => {
              socket.emit("enviar_resposta", index);
              
              container.querySelectorAll("button").forEach(b => {
                b.disabled = true;
                b.classList.remove("selected");
              });
              btn.classList.add("selected");

              if (statusEl) statusEl.textContent = "Resposta enviada! Aguarde...";
            };

            container.appendChild(btn);
          });
        }
      }
    });

    // 4. ATUALIZAÇÃO DO CRONÔMETRO
    socket.on("tick_tempo", (tempo) => {
      const cronometroText = document.getElementById("aluno-cronometro");
      if (cronometroText) {
        cronometroText.textContent = `⏱️ ${tempo}s`;
      }
    });

    // 5. RESULTADO DA RESPOSTA
    socket.on("resultado_resposta", (data) => {
      const fb = document.getElementById("feedback");
      const placar = document.getElementById("placar-total");

      const buttons = document.querySelectorAll("#options-aluno .option-btn");
      buttons.forEach(btn => {
        const btnIndex = parseInt(btn.dataset.index);
        if (data.respostaCorreta !== undefined && btnIndex === data.respostaCorreta) {
          btn.classList.add("correct-answer");
        } else if (btn.classList.contains("selected") && !data.correto) {
          btn.classList.add("wrong-answer");
        }
      });

      if (fb) {
        if (data.correto) {
          fb.textContent = `✅ VOCÊ ACERTOU! (+${data.pontos || 0} pts)`;
          fb.style.color = "#00ff66";
        } else {
          fb.textContent = "❌ RESPOSTA ERRADA!";
          fb.style.color = "#ff4444";
        }
      }

      if (placar && data.totalPontos !== undefined) {
        placar.textContent = `Pontuação Total: ${data.totalPontos} pts`;
      }
    });

    // 6. REVELAR RESPOSTA CORRETA
    socket.on("revelar_resposta", (data) => {
      const buttons = document.querySelectorAll("#options-aluno .option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (data.respostaCorreta !== undefined && parseInt(btn.dataset.index) === data.respostaCorreta) {
          btn.classList.add("correct-answer");
        }
      });
    });

    // 7. TEMPO ESGOTADO
    socket.on("tempo_esgotado", (data) => {
      const cronometroText = document.getElementById("aluno-cronometro");
      if (cronometroText) cronometroText.textContent = "⌛ ESGOTADO!";

      const buttons = document.querySelectorAll("#options-aluno .option-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (data && data.respostaCorreta !== undefined && parseInt(btn.dataset.index) === data.respostaCorreta) {
          btn.classList.add("correct-answer");
        }
      });

      const fb = document.getElementById("feedback");
      if (fb && !fb.textContent) {
        fb.textContent = "⏰ O tempo acabou!";
        fb.style.color = "#ffaa00";
      }
    });

    // 8. EVENTOS DE ELIMINAÇÃO E REINÍCIO DE JOGO
    socket.on("eliminado_retornar_inicio", (data) => {
      localStorage.removeItem("quiz_aluno_nome");
      localStorage.removeItem("quiz_aluno_escola");
      localStorage.removeItem("quiz_aluno_foto");

      document.getElementById("nome").value = "";
      document.getElementById("escola").value = "";
      document.getElementById("foto-input").value = "";
      fotoBase64 = "";
      document.getElementById("preview-foto").src = FOTO_PADRAO;

      document.getElementById("status").textContent = "Aguardando a pergunta...";
      document.getElementById("options-aluno").innerHTML = "";
      document.getElementById("question-container").style.display = "none";
      document.getElementById("feedback").textContent = "";
      document.getElementById("placar-total").textContent = "";

      document.getElementById("game-screen").style.display = "none";
      document.getElementById("login-screen").style.display = "block";

      alert(data?.mensagem || "Obrigado por participar! Você não avançou para o TOP 4.");
    });

    socket.on("classificado_top4", (data) => {
      alert(data?.mensagem || "🔥 Parabéns! Você está classificado para o TOP 4!");
      
    });

    socket.on("quiz_reiniciado", () => {
      document.getElementById("status").textContent = "Aguardando o professor iniciar...";
      document.getElementById("options-aluno").innerHTML = "";
      document.getElementById("question-container").style.display = "none";
      document.getElementById("feedback").textContent = "";
      document.getElementById("placar-total").textContent = "";
    });

    socket.on("resetar_aluno", () => {
      localStorage.removeItem("quiz_aluno_nome");
      localStorage.removeItem("quiz_aluno_escola");
      localStorage.removeItem("quiz_aluno_foto");

      document.getElementById("nome").value = "";
      document.getElementById("escola").value = "";
      document.getElementById("foto-input").value = "";
      fotoBase64 = "";
      document.getElementById("preview-foto").src = FOTO_PADRAO;

      document.getElementById("status").textContent = "Aguardando a pergunta...";
      document.getElementById("options-aluno").innerHTML = "";
      document.getElementById("question-container").style.display = "none";
      document.getElementById("feedback").textContent = "";
      document.getElementById("placar-total").textContent = "";

      document.getElementById("game-screen").style.display = "none";
      document.getElementById("login-screen").style.display = "block";
    });
  </script>
</body>
</html>
